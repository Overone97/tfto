<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tfto</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #020617;
        --panel: rgba(15, 23, 42, 0.92);
        --line: rgba(255,255,255,0.08);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --ally: #22c55e;
        --enemy: #ef4444;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        background: radial-gradient(circle at top, rgba(56,189,248,0.18), transparent 24%), var(--bg);
        color: var(--text);
      }
      .screen {
        min-height: 100vh;
        padding: 24px;
      }
      .version {
        position: fixed;
        top: 18px;
        left: 18px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(15,23,42,0.95);
        border: 1px solid var(--line);
        color: #7dd3fc;
        font-weight: 700;
        z-index: 5;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 20px;
        box-shadow: 0 18px 50px rgba(0,0,0,0.3);
      }
      .hero, .section-head, .actions, .hero-stats {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
      }
      .hero-stats, .tags {
        flex-wrap: wrap;
      }
      .hero-stats span {
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--line);
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr);
        gap: 20px;
        margin-top: 20px;
      }
      .stack {
        display: grid;
        gap: 20px;
      }
      .board {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 10px;
        margin-top: 12px;
      }
      .cell {
        min-height: 116px;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.04);
        padding: 10px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        text-align: left;
        color: inherit;
      }
      .cell.zone-player {
        background: rgba(34,197,94,0.05);
      }
      .cell.zone-enemy {
        background: rgba(239,68,68,0.05);
      }
      .cell.team-player {
        border-color: rgba(34,197,94,0.45);
        box-shadow: inset 0 0 0 1px rgba(34,197,94,0.18);
      }
      .cell.team-enemy {
        border-color: rgba(239,68,68,0.45);
        box-shadow: inset 0 0 0 1px rgba(239,68,68,0.18);
      }
      .cell-coords, small, .empty-state {
        font-size: 12px;
        color: var(--muted);
      }
      .cell-action {
        color: var(--accent-2);
        font-size: 12px;
      }
      h1, h2, p { margin-top: 0; }
      button {
        border: 0;
        border-radius: 14px;
        padding: 12px 16px;
        background: var(--accent);
        color: #082f49;
        font-weight: 700;
        cursor: pointer;
      }
      button.ghost {
        background: rgba(255,255,255,0.06);
        color: var(--text);
        border: 1px solid var(--line);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .shop, .bench, .synergies {
        display: grid;
        gap: 12px;
        margin-top: 12px;
      }
      .shop-card, .bench-card, .synergy-card, .income-box {
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 14px;
      }
      .shop-card {
        display: grid;
        gap: 10px;
      }
      .bench-card {
        width: 100%;
        display: grid;
        gap: 8px;
        text-align: left;
        color: var(--text);
        background: rgba(255,255,255,0.04);
      }
      .bench-card.is-selected {
        border-color: rgba(56,189,248,0.85);
        box-shadow: 0 0 0 1px rgba(56,189,248,0.25);
      }
      .synergy-card, .income-box {
        display: grid;
        gap: 6px;
      }
      .fusion-box {
        margin-bottom: 12px;
        border-color: rgba(245,158,11,0.45);
      }
      .tag {
        display: inline-flex;
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(255,255,255,0.06);
        border: 1px solid var(--line);
        font-size: 11px;
        margin-right: 6px;
      }
      @media (max-width: 960px) {
        .layout { grid-template-columns: 1fr; }
        .hero, .section-head, .actions { flex-direction: column; align-items: stretch; }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
