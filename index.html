<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tfto</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #020617;
        --panel: rgba(15, 23, 42, 0.92);
        --line: rgba(255,255,255,0.08);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --ally: #22c55e;
        --enemy: #ef4444;
        --accent: #38bdf8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        background: radial-gradient(circle at top, rgba(56,189,248,0.18), transparent 24%), var(--bg);
        color: var(--text);
      }
      .screen {
        min-height: 100vh;
        padding: 24px;
      }
      .version {
        position: fixed;
        top: 18px;
        left: 18px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(15,23,42,0.95);
        border: 1px solid var(--line);
        color: #7dd3fc;
        font-weight: 700;
        z-index: 5;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 20px;
        box-shadow: 0 18px 50px rgba(0,0,0,0.3);
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
        gap: 20px;
        margin-top: 20px;
      }
      .board {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 10px;
        margin-top: 12px;
      }
      .cell {
        min-height: 110px;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.04);
        padding: 10px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .cell.team-player {
        border-color: rgba(34,197,94,0.45);
        box-shadow: inset 0 0 0 1px rgba(34,197,94,0.18);
      }
      .cell.team-enemy {
        border-color: rgba(239,68,68,0.45);
        box-shadow: inset 0 0 0 1px rgba(239,68,68,0.18);
      }
      .cell-coords {
        font-size: 11px;
        color: var(--muted);
      }
      h1, h2, p { margin-top: 0; }
      small { color: var(--muted); }
      button {
        border: 0;
        border-radius: 14px;
        padding: 12px 16px;
        background: var(--accent);
        color: #082f49;
        font-weight: 700;
        cursor: pointer;
      }
      @media (max-width: 960px) {
        .layout { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
